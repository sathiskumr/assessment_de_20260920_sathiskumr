version: 2

models:
  - name: fct_city_daily
    description: >
      One row per city per calendar day — the table a BI/reporting user would
      query. Adds a few derived convenience columns on top of stg_weather_daily
      (temp range, daylight/sunshine in hours, a rainy-day flag). Composite-key
      uniqueness and plausible-value checks live in dbt/tests/ as singular tests,
      since they check more than one column at once.
    columns:
      - name: city
        description: City name.
        tests:
          - not_null
      - name: weather_date
        description: Calendar date.
        tests:
          - not_null
      - name: temp_max_c
        description: Max daily temperature in Celsius.
        tests:
          - not_null
      - name: temp_min_c
        description: Min daily temperature in Celsius.
        tests:
          - not_null
      - name: precipitation_mm
        description: Total daily precipitation in millimetres.
        tests:
          - not_null
      - name: is_rainy_day
        description: True when precipitation_mm is greater than 0.