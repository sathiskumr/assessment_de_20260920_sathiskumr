version: 2

models:
  - name: stg_weather_daily
    description: >
      Cleaned, typed, one-to-one view over public.raw_weather_daily. Column names are
      standardised (units made explicit) and unit-converted where noted; no
      aggregation or business logic happens here — that's fct_city_daily's job.
    columns:
      - name: city
        description: City name.
        tests:
          - not_null
      - name: weather_date
        description: Calendar date of the observation.
        tests:
          - not_null
      - name: temp_max_c
        description: Max daily temperature in Celsius.
      - name: temp_min_c
        description: Min daily temperature in Celsius.
      - name: precipitation_mm
        description: Total daily precipitation in millimetres.
      - name: wind_speed_max_kmh
        description: Max daily wind speed in km/h.